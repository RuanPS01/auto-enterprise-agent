[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "empresa-auto"
version = "0.1.0"
description = "Agente autônomo que cria e opera uma empresa 24 horas por dia usando apenas modelos de linguagem locais e de código aberto."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "cryptography>=42",
    "playwright>=1.45",
    "psutil>=5.9",
    "ddgs>=9.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
empresa-auto = "empresa_auto.__main__:principal"

[tool.setuptools.packages.find]
include = ["empresa_auto*"]

[tool.setuptools.package-data]
empresa_auto = ["painel/estatico/*", "habilidades_embutidas/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
